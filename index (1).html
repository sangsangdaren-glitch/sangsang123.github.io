<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#111827">
  <title>店铺菜单</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="page">
  <header class="store-head">
    <div class="brand-row">
      <div>
        <h1 id="storeName">店铺菜单</h1>
        <p id="storeNotice" class="notice">欢迎光临</p>
      </div>
      <button id="shareBtn" class="share-btn" type="button">分享</button>
    </div>
  </header>

  <main>
    <section id="categoryBar" class="category-bar" aria-label="商品分类"></section>
    <section id="products" class="products"></section>
    <div id="empty" class="empty" hidden>这个分类暂时没有商品</div>
  </main>
</div>

<div id="productModal" class="modal" hidden>
  <div class="modal-backdrop"></div>
  <div class="modal-card" role="dialog" aria-modal="true">
    <button class="modal-close" id="modalClose" type="button">×</button>
    <div id="modalImageWrap" class="modal-image-wrap"></div>
    <div class="modal-body">
      <h2 id="modalTitle"></h2>
      <div id="modalPrice" class="modal-price"></div>
      <p id="modalDesc" class="modal-desc"></p>
    </div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
