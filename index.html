<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>店铺菜单</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="header">
    <h1 id="storeName">加载中...</h1>
    <p id="storeNotice" class="notice"></p>
  </header>

  <nav id="categoryBar" class="category-bar"></nav>

  <main>
    <div id="products" class="products"></div>
    <p id="empty" class="empty" hidden>这个分类暂时没有商品</p>
  </main>

  <div id="productModal" class="modal" hidden>
    <div class="modal-backdrop"></div>
    <div class="modal-content">
      <button id="modalClose" class="modal-close">×</button>
      <div id="modalImageWrap" class="modal-image"></div>
      <h2 id="modalTitle"></h2>
      <div id="modalPrice" class="modal-price"></div>
      <p id="modalDesc" class="modal-desc"></p>
    </div>
  </div>

  <button id="shareBtn" class="share-btn">分享菜单</button>

  <script src="app.js"></script>
</body>
</html>
