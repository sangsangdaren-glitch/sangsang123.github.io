<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FBF7F5">
<meta name="format-detection" content="telephone=no">
<title>店铺菜单</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app" class="app">

  <header class="shop-head">
    <div class="head-row">
      <h1 id="storeName" class="shop-name">店铺菜单</h1>
      <button id="shareBtn" class="icon-btn" type="button" aria-label="分享菜单">
        <svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-share"/></svg>
      </button>
    </div>
    <p id="storeNotice" class="shop-notice" hidden></p>
  </header>

  <nav id="categoryBar" class="cat-bar" aria-label="商品分类"></nav>

  <main class="stage">
    <div id="skeleton" class="skeleton">
      <div class="sk-grid">
        <div class="sk-card"><div class="sk-img"></div><div class="sk-body"><div class="sk-line w70"></div><div class="sk-line w45"></div></div></div>
        <div class="sk-card"><div class="sk-img"></div><div class="sk-body"><div class="sk-line w70"></div><div class="sk-line w45"></div></div></div>
        <div class="sk-card"><div class="sk-img"></div><div class="sk-body"><div class="sk-line w70"></div><div class="sk-line w45"></div></div></div>
        <div class="sk-card"><div class="sk-img"></div><div class="sk-body"><div class="sk-line w70"></div><div class="sk-line w45"></div></div></div>
      </div>
    </div>

    <div id="products" class="grid" hidden></div>

    <div id="moreWrap" class="more-wrap" hidden>
      <button id="moreBtn" class="more-btn" type="button">看更多</button>
    </div>

    <div id="tipEmpty" class="tip" hidden>
      <div class="tip-ico"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-box"/></svg></div>
      <p class="tip-title">这个分类还没有上新</p>
      <p class="tip-desc">换个分类看看，或者等我上新。</p>
    </div>

    <div id="tipError" class="tip" hidden>
      <div class="tip-ico soft"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-wifi"/></svg></div>
      <p class="tip-title">菜单没加载出来</p>
      <p class="tip-desc">网络不太顺，等一下再试。</p>
      <button id="retryBtn" class="btn solid btn-inline" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-retry"/></svg>重新加载
      </button>
    </div>
  </main>

  <div class="action-bar">
    <button id="shareBarBtn" class="btn solid" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-share"/></svg>分享给顾客
    </button>
    <button id="topBtn" class="btn ghost" type="button" hidden>回到顶部</button>
  </div>

  <div id="sheet" class="sheet" hidden>
    <div id="sheetMask" class="sheet-mask"></div>
    <div class="sheet-panel" role="dialog" aria-modal="true" aria-labelledby="sheetName">
      <div class="sheet-grip"></div>
      <button id="sheetClose" class="sheet-close" type="button" aria-label="关闭">
        <svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-close"/></svg>
      </button>
      <div class="sheet-scroll">
        <div id="sheetImage" class="sheet-image"></div>
        <div class="sheet-body">
          <h2 id="sheetName" class="sheet-name"></h2>
          <div id="sheetPrice" class="sheet-price"></div>
          <div id="sheetTags" class="sheet-tags" hidden></div>
          <p id="sheetDesc" class="sheet-desc" hidden></p>
        </div>
      </div>
      <div class="sheet-actions">
        <button id="sheetShare" class="btn solid" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-share"/></svg>分享这个商品
        </button>
        <button id="sheetCloseBtn" class="btn ghost" type="button">关闭</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast" hidden></div>

</div>

<svg class="sprite" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false">
  <symbol id="i-share" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="18" cy="5.5" r="2.5"/><circle cx="6" cy="12" r="2.5"/><circle cx="18" cy="18.5" r="2.5"/>
    <path d="m8.2 10.8 7.6-4"/><path d="m8.2 13.2 7.6 4"/>
  </symbol>
  <symbol id="i-close" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
    <path d="M6 6l12 12M18 6 6 18"/>
  </symbol>
  <symbol id="i-box" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M3.5 8.5 12 4l8.5 4.5v7L12 20l-8.5-4.5z"/>
    <path d="M3.5 8.5 12 13l8.5-4.5M12 13v7"/>
  </symbol>
  <symbol id="i-wifi" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
    <path d="M3 9.5a13 13 0 0 1 18 0"/><path d="M6.5 13a8 8 0 0 1 11 0"/><path d="M10 16.5a3 3 0 0 1 4 0"/>
  </symbol>
  <symbol id="i-retry" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M20 12a8 8 0 1 1-2.4-5.7"/><path d="M20.5 3.5v5h-5"/>
  </symbol>
  <symbol id="i-copy" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
    <rect x="9" y="9" width="11" height="11" rx="2.6"/><path d="M15 5.5A2.5 2.5 0 0 0 12.5 3H6.5A2.5 2.5 0 0 0 4 5.5v6A2.5 2.5 0 0 0 6.5 14"/>
  </symbol>
  <symbol id="i-sock" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M9 3h6v7c0 2.5 1.6 4 3.4 5.2 1 .7 1.6 1.6 1.6 2.6 0 1.8-1.5 3.2-3.3 3.2h-2.4c-2.6 0-4.8-2-4.8-4.6 0-1.6.7-3 1.8-4.2C12 11.1 13 9.6 13 8V3"/>
    <path d="M9 6.5h6"/>
  </symbol>
  <symbol id="i-shoe" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M2 17h13.5c1.6 0 3-.9 3.7-2.2L21 12l-4.4-.9-2.2-2.6-3.1 1.3L7 11 4 12.2z"/>
    <path d="M2 17v-3.6"/><path d="M9.5 9.8 11 12"/>
  </symbol>
  <symbol id="i-video" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <rect x="2.5" y="5" width="14" height="14" rx="3.5"/>
    <path d="M16.5 11.2 21 8.4v7.2l-4.5-2.8z"/><path d="M7.5 10.5v3"/>
  </symbol>
</svg>

<script src="app.js"></script>
</body>
</html>
